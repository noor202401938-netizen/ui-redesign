class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.sel) || 'homework';
    const out = {};
    ['homework', 'later', 'games', 'uniform', 'fourday', 'surprise'].forEach((k) => {
      out['c_' + k] = sel === k ? 'on' : '';
      out['p_' + k] = sel === k;
      out['f_' + k] = () => this.setState({ sel: k });
    });
    return out;
  }
}
</script>
