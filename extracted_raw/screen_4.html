<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.sel) || 'quick';
    const out = {};
    ['quick', 'full'].forEach((k) => {
      out['c_' + k] = sel === k ? 'on' : '';
      out['p_' + k] = sel === k;
      out['f_' + k] = () => this.setState({ sel: k });
    });
    return out;
  }
}
</script>
